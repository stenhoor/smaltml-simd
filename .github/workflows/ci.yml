name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck on TypeScript 7, the tests with node --test, the build on TypeScript 6.0.3: on the family's lowest Node
  # (22.18, the first that runs TypeScript without a flag) and the latest 22.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22.18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # smaltml's own tests with the plugin on (smaltml ADR 0035, item 7): every compare case against scikit-learn within
  # its tolerance, and threaded fits equal to fitSync, with plain SIMD and with fused multiply-add. smaltml is checked
  # out at the commit this repository pins it to.
  smaltml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        fma: ['0', '1']
    steps:
      - uses: actions/checkout@v4
        with:
          path: smaltml-simd
      - id: pin
        run: echo "commit=$(node -p "require('./smaltml-simd/package.json').devDependencies['@smaltworks/smaltml'].split('#')[1]")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: stenhoor/smaltml
          ref: ${{ steps.pin.outputs.commit }}
          path: smaltml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: smaltml-simd
      - run: npm ci
        working-directory: smaltml
      - run: npx vitest run --root . --config ../smaltml-simd/test/smaltml.vitest.config.ts test/compare.test.ts test/parallel.test.ts test/hardware.test.ts
        working-directory: smaltml
        env:
          SMALTML_SIMD_FMA: ${{ matrix.fma }}

  # Every playground of the docs site, run in Chromium, must show its page's tested result.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      NPM_CONFIG_PREFIX: /tmp/npm-global
      NODE_PATH: /tmp/npm-global/lib/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g playwright@1.64.1
      - run: npm run test:browser
